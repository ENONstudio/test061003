<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RAIN — ENÖN</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#f5f5f2;color:#151515;font-family:system-ui,-apple-system,sans-serif}body{display:flex;align-items:center;justify-content:center;padding:20px}.app{width:min(100%,440px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:11px;letter-spacing:.23em;color:#666}header b{font-size:16px;letter-spacing:.18em;color:#151515}.film{position:relative;width:100%;aspect-ratio:9/16;max-height:74svh;overflow:hidden;background:#ffffff;margin:auto;border:1px solid #dededb;border-radius:3px}canvas{width:100%;height:100%;display:block}.progress{height:2px;background:#dededb;margin:18px 0 14px}.progress span{display:block;height:100%;width:0;background:#1769ef}.controls{display:flex;gap:8px}button{font:inherit;font-size:12px;color:#151515;background:#ffffff;border:1px solid #d7d7d2;padding:12px 14px;border-radius:6px;cursor:pointer}button:first-child{flex:1}button:hover{background:#ededeb}button:focus-visible{outline:2px solid #1769ef;outline-offset:3px}.note{color:#686868;font-size:11px;line-height:1.9;margin:14px 0 0;letter-spacing:.05em}.film:fullscreen{height:100%;width:100%;max-height:none;border:0;border-radius:0;aspect-ratio:auto} @media(max-height:650px){.film{max-height:65svh}}
</style></head><body><main class="app"><header><b>ENÖN</b><span>RAIN / 20 SECONDS</span></header><div class="film" id="film"><canvas id="canvas" aria-label="A 20-second animation of the Japanese character for rain multiplying into a pattern and returning to one character"></canvas></div><div class="progress" role="progressbar" aria-label="Playback time" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0"><span id="bar"></span></div><div class="controls"><button id="play">Play</button><button id="replay">Restart</button><button id="full">Fullscreen</button></div><p class="note" id="note">Watch a word become a pattern.<br>20 seconds · silent · made to be watched anywhere.</p></main>
<script>
'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),film=document.getElementById('film'),play=document.getElementById('play'),bar=document.getElementById('bar');
let elapsed=0,playing=false,last=0,W=360,H=640;
const clamp=x=>Math.max(0,Math.min(1,x));const ease=x=>{x=clamp(x);return x*x*(3-2*x)};const mix=(a,b,t)=>a+(b-a)*t;
function resize(){const r=film.getBoundingClientRect();W=r.width;H=r.height;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);draw(elapsed)}
function glyph(x,y,size,rotation=0,alpha=1,flip=1,color='#111111'){ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.scale(flip,1);ctx.globalAlpha=clamp(alpha);ctx.fillStyle=color;ctx.font=`${size}px "Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('雨',0,size*.015);ctx.restore()}
function label(text,y,alpha,size=12){ctx.save();ctx.globalAlpha=clamp(alpha);ctx.fillStyle='#555555';ctx.font=`${size}px system-ui,sans-serif`;ctx.textAlign='center';ctx.fillText(text,W/2,y);ctx.restore()}
function pattern(t,alpha=1){const grow=ease((t-3)/6),cols=Math.round(mix(3,11,grow)),rows=Math.ceil(cols*H/W);const cell=W/cols;const warp=ease((t-9)/5);ctx.save();ctx.globalAlpha=alpha;for(let j=-1;j<=rows;j++){for(let i=-1;i<=cols;i++){const n=i+j*13;let x=(i+.5)*cell,y=(j+.5)*cell;const r=Math.sin(n*1.7+t*.35)*warp*.85; x+=Math.sin(j*.8+t*.35)*cell*.16*warp; y+=Math.sin(i*.6+t*.24)*cell*.14*warp;const local=ease((t-3-(Math.abs(i-cols/2)+Math.abs(j-rows/2))*.11)/1.5);glyph(x,y,cell*mix(.65,.94,warp),r,local,(n%5===0&&warp>.7)?-1:1,n%7===0?'#1769ef':'#111111')}}ctx.restore()}
function draw(t){ctx.clearRect(0,0,W,H);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H); // Stable paper grain; never flashes.
ctx.fillStyle='rgba(0,0,0,.016)';for(let i=0;i<480;i++){const x=((i*73.17)%997)/997*W,y=((i*127.13)%991)/991*H;ctx.fillRect(x,y,1,1)}
if(t<5){glyph(W/2,H*.47,W*.40,0,1-ease((t-3)/2));label('R A I N',H*.65,1-ease((t-2)/1.2),12);label('Look a little longer.',H*.81,1-ease((t-2.3)/1),11)}
if(t>3&&t<17.8)pattern(t,1-ease((t-16)/1.8));
if(t>16){const a=ease((t-16.5)/1.8);glyph(W/2,H*.47,W*.40,0,a);label('A word, or a shape?',H*.68,ease((t-18)/1.2),14);label('ENÖN',H*.92,ease((t-18.8)/1),10)}
bar.style.width=(t/20*100)+'%';bar.parentElement.setAttribute('aria-valuenow',Math.floor(t))}
function tick(now){if(playing){elapsed=Math.min(20,elapsed+(now-last)/1000);draw(elapsed);if(elapsed>=20){playing=false;play.textContent='Replay'}}last=now;requestAnimationFrame(tick)}
play.addEventListener('click',()=>{if(elapsed>=20)elapsed=0;playing=!playing;last=performance.now();play.textContent=playing?'Pause':'Play';draw(elapsed)});document.getElementById('replay').addEventListener('click',()=>{elapsed=0;playing=true;last=performance.now();play.textContent='Pause';draw(0)});
document.getElementById('full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(film.requestFullscreen)await film.requestFullscreen();else document.getElementById('note').textContent='Fullscreen is unavailable here. You can still play in this view.'}catch(e){document.getElementById('note').textContent='You can still play in this view.'}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){playing=false;play.textContent='Play'}});new ResizeObserver(resize).observe(film);resize();requestAnimationFrame(tick);
</script></body></html>
